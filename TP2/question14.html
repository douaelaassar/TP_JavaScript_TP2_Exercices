<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP2 - Question 14 : Drag and Drop</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:20px;background:#f1f4ff;color:#20243a}
main{background:white;padding:25px;border-radius:14px;box-shadow:0 5px 18px #0001}
h1{color:#3446a5}button{padding:10px 16px;margin:5px;background:#3446a5;color:white;border:0;border-radius:7px;cursor:pointer}
input,select{padding:9px;margin:5px;border:1px solid #bbb;border-radius:6px}.result{padding:12px;background:#eef1ff;border-radius:8px;margin-top:14px}

</style>
</head><body><main><h1>TP2 - Question 14 : Drag and Drop</h1><p>Glisse le carré dans la zone pointillée.</p><div id="carre" draggable="true" style="width:100px;padding:20px;background:#5268d8;color:white;text-align:center;border-radius:8px">Déplace-moi</div><div id="zone" style="margin-top:20px;min-height:130px;border:2px dashed #3446a5;border-radius:8px;display:grid;place-items:center">Dépose ici</div></main>
<script>let carre = document.getElementById("carre"), zone = document.getElementById("zone");
carre.addEventListener("dragstart", function(e) { e.dataTransfer.setData("text/plain", "carre"); });
zone.addEventListener("dragover", function(e) { e.preventDefault(); });
zone.addEventListener("drop", function(e) { e.preventDefault(); zone.appendChild(carre); });</script></body></html>
