<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP2 - Question 10 : Fenêtre modale</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:20px;background:#f1f4ff;color:#20243a}
main{background:white;padding:25px;border-radius:14px;box-shadow:0 5px 18px #0001}
h1{color:#3446a5}button{padding:10px 16px;margin:5px;background:#3446a5;color:white;border:0;border-radius:7px;cursor:pointer}
input,select{padding:9px;margin:5px;border:1px solid #bbb;border-radius:6px}.result{padding:12px;background:#eef1ff;border-radius:8px;margin-top:14px}

</style>
</head><body><main><h1>TP2 - Question 10 : Fenêtre modale</h1><button id="ouvrir">Ouvrir</button><div id="modal" style="display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center"><div style="background:white;color:#222;padding:30px;border-radius:10px"><p>Notification : bonjour !</p><button id="fermer">Fermer</button></div></div></main>
<script>let modal = document.getElementById("modal");
document.getElementById("ouvrir").addEventListener("click", function() { modal.style.display = "flex"; });
document.getElementById("fermer").addEventListener("click", function() { modal.style.display = "none"; });
modal.addEventListener("click", function(e) { if (e.target === modal) modal.style.display = "none"; });</script></body></html>
