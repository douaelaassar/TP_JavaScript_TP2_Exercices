<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP2 - Question 13 : Barre de progression</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:20px;background:#f1f4ff;color:#20243a}
main{background:white;padding:25px;border-radius:14px;box-shadow:0 5px 18px #0001}
h1{color:#3446a5}button{padding:10px 16px;margin:5px;background:#3446a5;color:white;border:0;border-radius:7px;cursor:pointer}
input,select{padding:9px;margin:5px;border:1px solid #bbb;border-radius:6px}.result{padding:12px;background:#eef1ff;border-radius:8px;margin-top:14px}

</style>
</head><body><main><h1>TP2 - Question 13 : Barre de progression</h1><progress id="barre" value="0" max="100" style="width:100%;height:25px"></progress><p id="pourcentage">0%</p><button id="avancer">Avancer</button><button id="reinitialiser">Réinitialiser</button></main>
<script>let valeur = 0;
function mettreAJour() { document.getElementById("barre").value = valeur; document.getElementById("pourcentage").textContent = valeur + "%"; }
document.getElementById("avancer").addEventListener("click", function() { valeur = Math.min(100, valeur + 10); mettreAJour(); });
document.getElementById("reinitialiser").addEventListener("click", function() { valeur = 0; mettreAJour(); });</script></body></html>
