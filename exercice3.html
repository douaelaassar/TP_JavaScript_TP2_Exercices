<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercice 3 : Trier un tableau</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:20px;background:#f1f4ff;color:#20243a}
main{background:white;padding:25px;border-radius:14px;box-shadow:0 5px 18px #0001}
h1{color:#3446a5}button{padding:10px 16px;margin:5px;background:#3446a5;color:white;border:0;border-radius:7px;cursor:pointer}
input,select{padding:9px;margin:5px;border:1px solid #bbb;border-radius:6px}.result{padding:12px;background:#eef1ff;border-radius:8px;margin-top:14px}

</style>
</head><body><main><h1>Exercice 3 : Trier un tableau</h1><p>Tableau initial : <strong id="initial"></strong></p><button id="boutonTrier">Trier le tableau</button><p id="resultat" class="result"></p></main>
<script>let nombres = [12, 4, 25, 7, 1, 18];
document.getElementById("initial").textContent = nombres.join(", ");
function trier(tableau) {
  return tableau.slice().sort(function(a, b) { return a - b; });
}
document.getElementById("boutonTrier").addEventListener("click", function() {
  document.getElementById("resultat").textContent = "Tableau trié : " + trier(nombres).join(", ");
});</script></body></html>
