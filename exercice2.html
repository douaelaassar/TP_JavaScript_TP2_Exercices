<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercice 2 : Vérifier un email</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:20px;background:#f1f4ff;color:#20243a}
main{background:white;padding:25px;border-radius:14px;box-shadow:0 5px 18px #0001}
h1{color:#3446a5}button{padding:10px 16px;margin:5px;background:#3446a5;color:white;border:0;border-radius:7px;cursor:pointer}
input,select{padding:9px;margin:5px;border:1px solid #bbb;border-radius:6px}.result{padding:12px;background:#eef1ff;border-radius:8px;margin-top:14px}

</style>
</head><body><main><h1>Exercice 2 : Vérifier un email</h1><form id="formEmail"><label>Email : <input id="email" type="text" placeholder="nom@domaine.com"></label><button type="submit">Vérifier</button></form><p id="message" class="result"></p></main>
<script>document.getElementById("formEmail").addEventListener("submit", function(e) {
  e.preventDefault();
  let email = document.getElementById("email").value.trim();
  if (/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email)) {
    document.getElementById("message").textContent = "Adresse email valide.";
  } else {
    document.getElementById("message").textContent = "Adresse email invalide.";
  }
});</script></body></html>
